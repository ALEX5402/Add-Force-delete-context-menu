name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Runs once every year (at 00:00 UTC on January 1st) to keep release assets fresh and alive
    - cron: '0 0 1 1 *'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Executables & Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Generate date-based version and unique tag name
      - name: Generate Release Version & Tag
        id: get_version
        shell: pwsh
        run: |
          $dateVersion = (Get-Date).ToString("yyyy.MM.dd")
          $tagName = "v${dateVersion}-build${{ github.run_number }}"
          "version=${dateVersion}" >> $env:GITHUB_OUTPUT
          "tag_name=${tagName}" >> $env:GITHUB_OUTPUT
          Write-Host "Generated Version: $dateVersion"
          Write-Host "Generated Tag: $tagName"

      # Step 2: Build the 2 self-contained executables using PS2EXE (installer + uninstaller)
      - name: Build Executables with PS2EXE
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          .\build.ps1

      # Step 3: Verify only the 2 release executables exist (no x64/x86/arm64 deleter or zip)
      - name: Verify Built Assets
        shell: pwsh
        run: |
          $expected = @('ForceDelete-Setup.exe', 'Uninstall-ForceDelete.exe') | Sort-Object
          $actual = Get-ChildItem -Path .\dist -File | Select-Object -ExpandProperty Name | Sort-Object
          Get-ChildItem -Path .\dist | Format-Table -AutoSize Name, Length
          if (Compare-Object $actual $expected) {
            throw "Release assets must be exactly: $($expected -join ', '). Found: $($actual -join ', ')"
          }
          $banned = Get-ChildItem -Path .\dist -Include '*x64*', '*x86*', '*arm64*', '*.zip' -Recurse
          if ($banned) {
            throw "Banned release artifact(s) found: $($banned.Name -join ', ')"
          }

      # Step 4: Create GitHub Release and Upload Assets
      - name: Create Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Force Delete v${{ steps.get_version.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## Force Delete - Release v${{ steps.get_version.outputs.version }} (Build ${{ github.run_number }})

            Windows context menu utility that forcefully and instantly deletes locked, in-use, or undeletable files and folders. Includes the native Windows UAC security shield icon.

            ### Self-Contained Executables (no other downloads needed):
            - **`ForceDelete-Setup.exe`** - Single self-contained installer. `force_delete.ps1`, `uninstall.reg`, `clean_old_entries.reg` and `Uninstall-ForceDelete.exe` are all embedded inside it. Installs to Program Files and registers the context menu with the security shield icon — the same result as running `Install_Add-Force-context-menu.bat`.
            - **`Uninstall-ForceDelete.exe`** - Single self-contained uninstaller with `uninstall.reg` / `clean_old_entries.reg` embedded. Removes all context menu entries and the Program Files folder — the same result as running `Uninstall_Force-context-menu.bat`.

            ### Quick Start:
            1. Download and run **`ForceDelete-Setup.exe`** as Administrator.
            2. On Windows 11, pick [1] Classic (Force Delete shows directly on right-click) or [2] Modern (under "Show more options").
            3. Right-click any file or folder and click **Force Delete**!
            4. To remove it later, run **`Uninstall-ForceDelete.exe`** (or uninstall from Windows Settings > Installed Apps).
          files: |
            dist/ForceDelete-Setup.exe
            dist/Uninstall-ForceDelete.exe
